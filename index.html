<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple sample landing page">
  <title>Welcome</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f7fb;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem clamp(1.25rem, 6vw, 5rem);
      background: #fff;
      border-bottom: 1px solid #e6eaf0;
    }
    .brand { font-weight: 750; letter-spacing: .02em; }
    nav { display: flex; gap: 1.25rem; }
    nav a { color: #526078; text-decoration: none; font-size: .95rem; }
    nav a:hover { color: #315eea; }
    main {
      min-height: calc(100vh - 76px);
      display: grid;
      place-items: center;
      padding: 4rem 1.25rem;
      text-align: center;
    }
    .hero { max-width: 720px; }
    .eyebrow {
      display: inline-block;
      margin-bottom: 1rem;
      padding: .4rem .8rem;
      border-radius: 999px;
      color: #315eea;
      background: #e9efff;
      font-size: .85rem;
      font-weight: 650;
    }
    h1 { margin: 0; font-size: clamp(2.5rem, 7vw, 4.5rem); line-height: 1.05; }
    .intro { margin: 1.25rem auto 2rem; max-width: 560px; color: #647087; font-size: 1.1rem; line-height: 1.7; }
    .button {
      display: inline-block;
      padding: .85rem 1.25rem;
      border-radius: .65rem;
      color: #fff;
      background: #315eea;
      text-decoration: none;
      font-weight: 650;
      box-shadow: 0 8px 20px #315eea33;
    }
    .button:hover { background: #244bc4; }
    footer { padding: 1rem; color: #8791a3; text-align: center; font-size: .85rem; }
    @media (max-width: 480px) { nav { gap: .75rem; } nav a { font-size: .85rem; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">Your Project</div>
    <nav aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="home">
    <section class="hero" aria-labelledby="page-title">
      <span class="eyebrow">A sample landing page</span>
      <h1 id="page-title">A great place to start.</h1>
      <p class="intro">This is a clean, responsive starter page for your project. Update the text, links, and colors to make it your own.</p>
      <a class="button" href="#about">Explore the page</a>
    </section>
  </main>

  <footer id="contact">© 2026 Your Project. Made with care.</footer>
</body>
</html>
